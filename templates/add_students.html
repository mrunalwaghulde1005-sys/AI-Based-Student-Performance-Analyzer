<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Students - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <nav class="navbar glass-panel">
        <div class="nav-brand"><img src="{{ url_for('static', filename='img/logo.svg') }}" alt="AI Analyzer Logo" class="logo-img"> Admin Dashboard</div>
        <div class="nav-user">
            <span>Welcome, {{ username }}</span>
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline">Back to Dashboard</a>
            <a href="{{ url_for('logout') }}" class="btn btn-outline">Logout</a>
        </div>
    </nav>

    <div class="container main-content">
        <h2 class="section-title">Add Multiple Students</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="form-card glass-panel">
            <form id="studentsForm" action="{{ url_for('add_students') }}" method="POST">
                <div id="studentsContainer">
                    <div class="student-entry" style="border: 1px solid #444; padding: 1rem; margin-bottom: 1rem; border-radius: 8px;">
                        <h4>Student 1</h4>
                        <div class="input-row">
                            <div class="input-group">
                                <label for="username_0">Username</label>
                                <input type="text" id="username_0" name="username_0" required placeholder="e.g. student1">
                            </div>
                            <div class="input-group">
                                <label for="password_0">Password</label>
                                <input type="password" id="password_0" name="password_0" required placeholder="e.g. pass123">
                            </div>
                        </div>
                        <div class="input-row">
                            <div class="input-group">
                                <label for="name_0">Full Name</label>
                                <input type="text" id="name_0" name="name_0" required placeholder="e.g. John Doe">
                            </div>
                            <div class="input-group">
                                <label for="roll_number_0">Roll Number</label>
                                <input type="text" id="roll_number_0" name="roll_number_0" required placeholder="e.g. CS101">
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="form-actions" style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="button" id="addStudentBtn" class="btn btn-secondary">Add Another Student</button>
                    <button type="submit" class="btn btn-primary">Save All Students</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let studentCount = 1;

        document.getElementById('addStudentBtn').addEventListener('click', function() {
            const container = document.getElementById('studentsContainer');
            const newEntry = document.createElement('div');
            newEntry.className = 'student-entry';
            newEntry.style.cssText = 'border: 1px solid #444; padding: 1rem; margin-bottom: 1rem; border-radius: 8px;';
            
            newEntry.innerHTML = `
                <h4>Student ${studentCount + 1}</h4>
                <div class="input-row">
                    <div class="input-group">
                        <label for="username_${studentCount}">Username</label>
                        <input type="text" id="username_${studentCount}" name="username_${studentCount}" required placeholder="e.g. student${studentCount + 1}">
                    </div>
                    <div class="input-group">
                        <label for="password_${studentCount}">Password</label>
                        <input type="password" id="password_${studentCount}" name="password_${studentCount}" required placeholder="e.g. pass123">
                    </div>
                </div>
                <div class="input-row">
                    <div class="input-group">
                        <label for="name_${studentCount}">Full Name</label>
                        <input type="text" id="name_${studentCount}" name="name_${studentCount}" required placeholder="e.g. John Doe">
                    </div>
                    <div class="input-group">
                        <label for="roll_number_${studentCount}">Roll Number</label>
                        <input type="text" id="roll_number_${studentCount}" name="roll_number_${studentCount}" required placeholder="e.g. CS10${studentCount + 1}">
                    </div>
                </div>
                <button type="button" class="btn btn-danger btn-sm remove-student" style="margin-top: 0.5rem;">Remove</button>
            `;
            
            container.appendChild(newEntry);
            studentCount++;
            
            // Add remove functionality
            newEntry.querySelector('.remove-student').addEventListener('click', function() {
                container.removeChild(newEntry);
                studentCount--;
                updateHeaders();
            });
        });

        function updateHeaders() {
            const entries = document.querySelectorAll('.student-entry');
            entries.forEach((entry, index) => {
                entry.querySelector('h4').textContent = `Student ${index + 1}`;
            });
        }

        document.getElementById('studentsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const students = [];
            
            for (let i = 0; i < studentCount; i++) {
                const username = formData.get(`username_${i}`);
                const password = formData.get(`password_${i}`);
                const name = formData.get(`name_${i}`);
                const rollNumber = formData.get(`roll_number_${i}`);
                
                if (username && password && name && rollNumber) {
                    students.push({
                        username: username,
                        password: password,
                        name: name,
                        roll_number: rollNumber
                    });
                }
            }
            
            if (students.length === 0) {
                alert('Please add at least one student.');
                return;
            }
            
            // Create hidden inputs for JSON data
            students.forEach(student => {
                const hiddenInput = document.createElement('input');
                hiddenInput.type = 'hidden';
                hiddenInput.name = 'students';
                hiddenInput.value = JSON.stringify(student);
                this.appendChild(hiddenInput);
            });
            
            this.submit();
        });
    </script>
</body>
</html>
